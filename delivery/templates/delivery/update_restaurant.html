{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodFiesta | Update Restaurant</title>

    <link rel="stylesheet"
          href="{% static 'delivery/style.css' %}">

</head>

<body>

{% include 'delivery/_navbar.html' %}


<main class="form-page">

    <div class="form-card">

        <div class="eyebrow">
            RESTAURANT MANAGEMENT
        </div>

        <h1>Update restaurant</h1>

        <p class="form-subtitle">
            Update the information for {{ restaurant.name }}.
        </p>


        <form
            action="{% url 'update_restaurant' restaurant.id %}"
            method="post"
        >

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Restaurant name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ restaurant.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Picture URL
                </label>

                <input
                    type="url"
                    name="picture"
                    value="{{ restaurant.picture }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Cuisine
                </label>

                <input
                    type="text"
                    name="cuisine"
                    value="{{ restaurant.cuisine }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Rating
                </label>

                <input
                    type="number"
                    name="rating"
                    min="0"
                    max="5"
                    step="0.1"
                    value="{{ restaurant.rating }}"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary form-submit"
            >
                Save Changes
            </button>

        </form>

    </div>

</main>

</body>
</html>
