
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodFiesta | Payment</title>
    <link rel="stylesheet" href="{% static 'delivery/style.css' %}">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

{% include 'delivery/_navbar.html' %}

<main class="cart-page">
    <div class="page-heading">
        <div class="eyebrow">SECURE CHECKOUT</div>
        <h1>Complete your payment</h1>
        <p>Order #{{ order.id }}</p>
        <h2>₹{{ order.total_amount|floatformat:2 }}</h2>
    </div>

    <form id="payment-form" method="POST"
          action="{% url 'verify_payment' %}">
        {% csrf_token %}
        <input type="hidden" name="order_id" value="{{ order.id }}">
        <input type="hidden" name="razorpay_payment_id" id="payment_id">
        <input type="hidden" name="razorpay_order_id" id="payment_order_id">
        <input type="hidden" name="razorpay_signature" id="payment_signature">

        <button type="button" id="pay-button"
                class="btn btn-primary checkout-button">
            Pay ₹{{ order.total_amount|floatformat:2 }}
        </button>
    </form>
</main>

<script>
    const options = {
        key: "{{ razorpay_key_id|escapejs }}",
        amount: "{{ amount_paise }}",
        currency: "INR",
        name: "FoodFiesta",
        description: "Food order #{{ order.id }}",
        order_id: "{{ razorpay_order_id|escapejs }}",

        prefill: {
            name: "{{ customer.username|escapejs }}",
            email: "{{ customer.email|escapejs }}",
            contact: "{{ customer.mobile|escapejs }}"
        },

        theme: {
            color: "#245c45"
        },

        handler: function (response) {
            document.getElementById("payment_id").value =
                response.razorpay_payment_id;

            document.getElementById("payment_order_id").value =
                response.razorpay_order_id;

            document.getElementById("payment_signature").value =
                response.razorpay_signature;

            document.getElementById("payment-form").submit();
        },

        modal: {
            ondismiss: function () {
                document.getElementById("pay-button").disabled = false;
                document.getElementById("pay-button").textContent =
                    "Pay ₹{{ order.total_amount|floatformat:2 }}";
            }
        }
    };

    const razorpayCheckout = new Razorpay(options);

    document.getElementById("pay-button").addEventListener("click", function () {
        this.disabled = true;
        razorpayCheckout.open();
    });

    razorpayCheckout.on("payment.failed", function () {
        document.getElementById("pay-button").disabled = false;
        document.getElementById("pay-button").textContent =
            "Try Payment Again";
        alert("Payment failed. Your cart has not been cleared.");
    });
</script>

</body>
</html>
